<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanças Insight - Calendário de Metas</title>
  <style>
    /* Reset Básico e Fontes */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: #11111b;
      color: #cdd6f4;
      padding: 12px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Menu de Navegação por Abas */
    .navbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #181825;
      padding: 6px;
      border-radius: 12px;
    }

    .nav-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: #a6adc8;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-btn.ativo {
      background: #313244;
      color: #cdd6f4;
    }

    /* Conteúdo das Abas */
    .aba-conteudo {
      display: none;
    }

    .aba-conteudo.ativa {
      display: block;
    }

    /* Card de Resumo do Calendário */
    .card-resumo-calendario {
      background: #1e1e2e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #313244;
    }

    .header-calendario-controles {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .header-calendario-controles h3 {
      font-size: 1.1rem;
      color: #f5e0dc;
    }

    .btn-nav-mes {
      background: #313244;
      color: #cdd6f4;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .metricas-resumo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .metrica-item {
      background: #181825;
      padding: 8px;
      border-radius: 8px;
    }

    .metrica-item .label {
      display: block;
      font-size: 0.7rem;
      color: #a6adc8;
      margin-bottom: 4px;
    }

    .metrica-item strong {
      font-size: 0.85rem;
      color: #89b4fa;
    }

    /* Legenda de Cores */
    .legenda-container {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      margin-bottom: 12px;
      padding: 0 4px;
      color: #a6adc8;
    }

    .item-legenda {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .dot.verde { background-color: #a6e3a1; }
    .dot.amarelo { background-color: #f9e2af; }
    .dot.cinza { background-color: #45475a; }

    /* Grade do Calendário CSS Grid */
    .grade-dias-semana {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: bold;
      font-size: 0.75rem;
      color: #a6adc8;
      margin-bottom: 6px;
    }

    .grade-calendario {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .dia-card {
      background: #181825;
      border-radius: 8px;
      min-height: 60px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      border-left: 3px solid #45475a; /* Padrão Folga */
      transition: transform 0.1s ease;
    }

    .dia-card:active {
      transform: scale(0.96);
    }

    .dia-card.vazio {
      background: transparent;
      border: none;
      cursor: default;
    }

    .dia-card .num-dia {
      font-weight: bold;
      font-size: 0.75rem;
      color: #cdd6f4;
    }

    .dia-card .val-faturado {
      font-size: 0.68rem;
      font-weight: 600;
    }

    /* Cores de Status das Metas */
    .dia-card.meta-atingida {
      border-left-color: #a6e3a1;
      background: #1e2e24;
    }
    .dia-card.meta-atingida .val-faturado { color: #a6e3a1; }

    .dia-card.meta-parcial {
      border-left-color: #f9e2af;
      background: #2d2a1e;
    }
    .dia-card.meta-parcial .val-faturado { color: #f9e2af; }

    .dia-card.folga .val-faturado { color: #585b70; }

    /* Modal de Detalhes do Dia */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-conteudo {
      background: #1e1e2e;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      border: 1px solid #313244;
    }

    .modal-conteudo h4 {
      margin-bottom: 12px;
      color: #f5e0dc;
    }

    .campo-modal {
      margin-bottom: 12px;
    }

    .campo-modal label {
      display: block;
      font-size: 0.75rem;
      color: #a6adc8;
      margin-bottom: 4px;
    }

    .campo-modal input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #313244;
      background: #181825;
      color: #cdd6f4;
      font-size: 0.9rem;
    }

    .modal-acoes {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .btn-modal {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-salvar { background: #a6e3a1; color: #11111b; }
    .btn-fechar { background: #313244; color: #cdd6f4; }
  </style>
</head>
<body>

  <!-- Menu Principal -->
  <nav class="navbar">
    <button class="nav-btn ativo" onclick="trocarAba('lancamentos')">📊 Lançamentos</button>
    <button class="nav-btn" onclick="trocarAba('calendario')">📅 Calendário</button>
  </nav>

  <!-- Aba 1: Lançamentos (Simulação) -->
  <section id="aba-lancamentos" class="aba-conteudo ativa">
    <div class="card-resumo-calendario">
      <h3>Registrar Dia de Trabalho</h3>
      <p style="font-size: 0.8rem; color: #a6adc8; margin-top: 6px;">
        Alterne para a aba <strong>Calendário</strong> para visualizar o progresso visual das suas metas mensais!
      </p>
    </div>
  </section>

  <!-- Aba 2: Calendário -->
  <section id="aba-calendario" class="aba-conteudo">
    <!-- Painel de Resumo -->
    <div class="card-resumo-calendario">
      <div class="header-calendario-controles">
        <button class="btn-nav-mes" onclick="mudarMes(-1)">◀</button>
        <h3 id="cal-titulo-mes">Mês 2026</h3>
        <button class="btn-nav-mes" onclick="mudarMes(1)">▶</button>
      </div>
      
      <div class="metricas-resumo-grid">
        <div class="metrica-item">
          <span class="label">Meta Mensal</span>
          <strong id="cal-meta-mensal">R$ 7.586,26</strong>
        </div>
        <div class="metrica-item">
          <span class="label">Faturado</span>
          <strong id="cal-faturado-total">R$ 0,00</strong>
        </div>
        <div class="metrica-item">
          <span class="label">Dias Rodados</span>
          <strong id="cal-dias-rodados">0 / 22</strong>
        </div>
      </div>
    </div>

    <!-- Legenda de Cores -->
    <div class="legenda-container">
      <span class="item-legenda"><span class="dot verde"></span> Meta (≥ R$ 345)</span>
      <span class="item-legenda"><span class="dot amarelo"></span> Parcial</span>
      <span class="item-legenda"><span class="dot cinza"></span> Folga</span>
    </div>

    <!-- Dias da Semana -->
    <div class="grade-dias-semana">
      <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
    </div>

    <!-- Grade Dinâmica -->
    <div id="grade-calendario" class="grade-calendario"></div>
  </section>

  <!-- Modal para Detalhes e Lançamento Direto no Dia -->
  <div id="modal-dia" class="modal-overlay">
    <div class="modal-conteudo">
      <h4 id="modal-titulo-data">Detalhes do Dia</h4>
      
      <div class="campo-modal">
        <label for="input-faturamento">Faturamento Bruto (R$)</label>
        <input type="number" id="input-faturamento" placeholder="Ex: 350.00" step="0.01" />
      </div>

      <div class="modal-acoes">
        <button class="btn-modal btn-fechar" onclick="fecharModal()">Cancelar</button>
        <button class="btn-modal btn-salvar" onclick="salvarFaturamentoDia()">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    // Estado Global da Aplicação
    let dataAtualCal = new Date();
    let dataSelecionadaFormatada = '';
    const META_DIARIA = 345.00; // Meta do modelo híbrido (345/dia)

    // Troca de Abas
    function trocarAba(nomeAba) {
      document.querySelectorAll('.aba-conteudo').forEach(el => el.classList.remove('ativa'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('ativo'));

      const abaAlvo = document.getElementById(`aba-${nomeAba}`);
      if (abaAlvo) {
        abaAlvo.classList.add('ativa');
        event.target.classList.add('ativo');
        
        if (nomeAba === 'calendario') {
          renderizarCalendario();
        }
      }
    }

    // Navegação de Mês
    function mudarMes(delta) {
      dataAtualCal.setMonth(dataAtualCal.getMonth() + delta);
      renderizarCalendario();
    }

    // Renderiza a Grade do Calendário
    function renderizarCalendario() {
      const ano = dataAtualCal.getFullYear();
      const mes = dataAtualCal.getMonth();
      
      const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
      document.getElementById('cal-titulo-mes').innerText = `${nomesMeses[mes]} ${ano}`;

      const primeiroDiaSemana = new Date(ano, mes, 1).getDay();
      const totalDiasMes = new Date(ano, mes + 1, 0).getDate();
      const containerGrade = document.getElementById('grade-calendario');
      containerGrade.innerHTML = '';

      // Recupera dados salvos
      const lancamentos = JSON.parse(localStorage.getItem('financas_lancamentos') || '[]');

      let totalFaturadoMes = 0;
      let diasRodados = 0;

      // Células vazias de alinhamento do primeiro dia
      for (let i = 0; i < primeiroDiaSemana; i++) {
        const divVazia = document.createElement('div');
        divVazia.className = 'dia-card vazio';
        containerGrade.appendChild(divVazia);
      }

      // Preenche todos os dias do mês
      for (let dia = 1; dia <= totalDiasMes; dia++) {
        const dataFormatada = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}`;
        
        const faturadoDia = lancamentos
          .filter(l => l.data === dataFormatada)
          .reduce((acc, curr) => acc + Number(curr.valor || 0), 0);

        totalFaturadoMes += faturadoDia;

        const divDia = document.createElement('div');
        divDia.className = 'dia-card';

        if (faturadoDia >= META_DIARIA) {
          divDia.classList.add('meta-atingida');
          diasRodados++;
        } else if (faturadoDia > 0) {
          divDia.classList.add('meta-parcial');
          diasRodados++;
        } else {
          divDia.classList.add('folga');
        }

        divDia.innerHTML = `
          <span class="num-dia">${dia}</span>
          <span class="val-faturado">${faturadoDia > 0 ? 'R$ ' + faturadoDia.toFixed(0) : '-'}</span>
        `;

        divDia.onclick = () => abrirModalDia(dataFormatada, faturadoDia);
        containerGrade.appendChild(divDia);
      }

      // Atualiza resumos superiores
      document.getElementById('cal-faturado-total').innerText = `R$ ${totalFaturadoMes.toFixed(2)}`;
      document.getElementById('cal-dias-rodados').innerText = `${diasRodados} / 22`;
    }

    // Modal de Interação por Dia
    function abrirModalDia(dataFormatada, valorAtual) {
      dataSelecionadaFormatada = dataFormatada;
      const [ano, mes, dia] = dataFormatada.split('-');
      
      document.getElementById('modal-titulo-data').innerText = `Dia ${dia}/${mes}/${ano}`;
      document.getElementById('input-faturamento').value = valorAtual > 0 ? valorAtual : '';
      document.getElementById('modal-dia').style.display = 'flex';
    }

    function fecharModal() {
      document.getElementById('modal-dia').style.display = 'none';
    }

    function salvarFaturamentoDia() {
      const valorInput = parseFloat(document.getElementById('input-faturamento').value) || 0;
      let lancamentos = JSON.parse(localStorage.getItem('financas_lancamentos') || '[]');

      // Remove lançamentos prévios dessa data
      lancamentos = lancamentos.filter(l => l.data !== dataSelecionadaFormatada);

      // Se inseriu um valor válido, salva
      if (valorInput > 0) {
        lancamentos.push({
          data: dataSelecionadaFormatada,
          valor: valorInput
        });
      }

      localStorage.setItem('financas_lancamentos', JSON.stringify(lancamentos));
      fecharModal();
      renderizarCalendario();
    }

    // Inicialização da primeira renderização
    renderizarCalendario();
  </script>
</body>
</html>
